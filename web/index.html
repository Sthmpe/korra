<!DOCTYPE html>
<!-- Merchant App — Deploy to: business.korra.com.ng -->
<html>
<head>
  <base href="/">

  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A better way to accept installment payments.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Korra Business">
  <meta name="theme-color" content="#000000">

  <meta name="google-signin-client_id" content="761341878280-lo48183tmbcl7ckt16jt89tl2l4d44n5.apps.googleusercontent.com">
  <script type="text/javascript" src="https://sdk.monnify.com/plugin/monnify.js"></script>

  <link rel="apple-touch-icon" href="icons/korra_logo_icon.webp">
  <link rel="icon" type="image/webp" href="korra_logo_icon.webp">

  <title>Korra Business</title>

  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    body {
      background-color: #A54600;
      margin: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: opacity 0.5s ease;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      background-color: white;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      animation: pulse 2.5s infinite ease-in-out;
      margin-bottom: 40px;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .loader { display: flex; gap: 8px; }

    .dot {
      width: 10px; height: 10px;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%   { transform: scale(1);    box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
      50%  { transform: scale(1.05); box-shadow: 0 20px 45px rgba(0,0,0,0.3); }
      100% { transform: scale(1);    box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40%           { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="loading_indicator" class="splash-container">
    <div class="logo-container">
      <img src="korra_logo_icon.webp" class="logo" alt="Korra Logo">
    </div>
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- PWA JS — UI is handled by Flutter widget (global_install_button.dart) -->
  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function promptKorraInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Korra installed');
          }
          deferredPrompt = null;
        });
      }
    }

    function isKorraInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    }
  </script>

  <script>
    function removeSplashFromWeb() {
      var loading = document.getElementById("loading_indicator");
      if (loading) {
        loading.style.opacity = "0";
        setTimeout(function() { loading.remove(); }, 500);
      }
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.ready.then((registration) => {
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('Korra: New version detected! Updating...');
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
