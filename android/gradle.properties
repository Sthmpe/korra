# --- Performance (Safe & Fast) ---
# 3GB is a safe sweet spot. 8GB (your old setting) was overkill and could crash other apps.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8

# --- Caching & Parallelism ---
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# DISABLE 'configureondemand' for now. It can cause errors with some Flutter plugins.
# org.gradle.configureondemand=true

# --- Android Config ---
android.useAndroidX=true
android.enableJetifier=true

# --- NETWORK STABILITY (CRITICAL) ---
# We use 120000 (2 mins) to stop downloads from failing halfway.
systemProp.http.keepAlive=true
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000