# --- Performance (Safe & Fast) ---
# 3GB is a safe sweet spot. 8GB (your old setting) was overkill and could crash other apps.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8

# --- Caching & Parallelism ---
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
# DISABLE 'configureondemand' for now. It can cause errors with some Flutter plugins.
# org.gradle.configureondemand=true

# --- Android Config ---
android.useAndroidX=true
android.enableJetifier=true

# --- NETWORK STABILITY (CRITICAL) ---
# We use 120000 (2 mins) to stop downloads from failing halfway.
systemProp.http.keepAlive=true
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# --- R8 Full Mode ---
android.enableR8.fullMode=true

# Force the Kotlin compiler to build efficiently using stable snapshots
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true