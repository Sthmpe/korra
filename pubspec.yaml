name: korra
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: ^3.8.1

dependencies:
  app_links: ^6.3.2
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.0.0
  collection: ^1.19.1
  connectivity_plus: ^6.1.5
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_analytics: ^12.4.3
  firebase_auth: ^6.0.1
  firebase_core: ^4.1.1
  firebase_crashlytics: ^5.0.2
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cached_pdfview: ^0.4.3
  flutter_dotenv: ^6.0.0
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^19.5.0
  flutter_material_design_icons: ^3.1.0+7447
  flutter_screenutil: ^5.9.3
  flutter_staggered_grid_view: ^0.7.0
  font_awesome_flutter: ^11.0.0
  get: ^4.7.2
  google_fonts: ^6.3.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  iconsax: ^0.0.8
  image_picker: ^1.2.0
  intl: ^0.20.2
  lottie: ^3.4.0
  monnify_payment_sdk: ^1.0.8
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pin_code_fields: ^8.0.1
  pinput: ^5.0.2
  pub_semver: ^2.2.0
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Icon Generator
  flutter_launcher_icons: ^0.13.1
  # Splash Screen Generator
  flutter_native_splash: ^2.3.10
  dependency_validator: ^3.2.3

flutter:
  uses-material-design: true

#----Loacal Assest----#
  assets:
    - .env
    - .env.prod
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon" # Generates ic_launcher
  ios: true
  image_path: "assets/images/korra_logo_icon.webp"
  min_sdk_android: 21 # Required for adaptive icons
  remove_alpha_ios: true

flutter_native_splash:
  web: false

  # 1. LIGHT MODE (Brand Color Background)
  color: "#FFFFFF"
  image: "unused_assets/korra_logo_icon.png" 
  # branding: "unused_assets/korra_logo_icon.png" # Optional

  # 2. DARK MODE (Same Brand Color)
  color_dark: "#FFFFFF"
  image_dark: "unused_assets/korra_logo_icon.png"

  # 3. ANDROID 12+ (Adaptive Icon Background)
  android_12:
    image: "unused_assets/korra_logo_icon.png"
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

dependency_overrides:
  google_sign_in_android: 7.2.10