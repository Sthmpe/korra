name: korra
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  camera: ^0.11.2+1
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.0.0
  collection: ^1.19.1
  connectivity_plus: ^6.1.5
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_ai: ^3.3.0
  firebase_app_check: ^0.4.1+3
  firebase_auth: ^6.0.1
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^19.5.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  google_fonts: ^6.3.0
  google_mlkit_face_detection: ^0.13.1
  iconsax: ^0.0.8
  image_picker: ^1.2.0
  intl: ^0.20.2
  lottie: ^3.3.1
  material_design_icons_flutter: ^7.0.7296
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pin_code_fields: ^8.0.1
  pinput: ^5.0.2
  pub_semver: ^2.2.0
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Icon Generator
  flutter_launcher_icons: ^0.13.1
  # Splash Screen Generator
  flutter_native_splash: ^2.3.10
  dependency_validator: ^3.2.3

flutter:
  uses-material-design: true

#----Loacal Assest----#
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon" # Generates ic_launcher
  ios: true
  image_path: "assets/images/korra_logo_icon.webp"
  min_sdk_android: 21 # Required for adaptive icons
  remove_alpha_ios: true

flutter_native_splash:
  # 1. LIGHT MODE (Brand Color Background)
  color: "#A54600"
  image: "assets/images/korra_logo_icon.png" 
  # branding: "assets/images/korra_logo_icon.png" # Optional

  # 2. DARK MODE (Same Brand Color)
  color_dark: "#A54600"
  image_dark: "assets/images/korra_logo_icon.png"

  # 3. ANDROID 12+ (Adaptive Icon Background)
  android_12:
    image: "assets/images/korra_logo_icon.png"
    color: "#A54600"
    icon_background_color: "#A54600"
