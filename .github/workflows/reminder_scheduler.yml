name: Daily Plan Manager (Reminders & Cleanup)

on:
  schedule:
    # Runs at 08:00 UTC daily (9:00 AM Nigeria Time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub UI for testing

jobs:
  run-daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Edge Function
        run: |
          curl -X POST '${{ secrets.SUPABASE_URL }}/functions/v1/send-reminders' \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json" \
          --fail \
          --max-time 320
